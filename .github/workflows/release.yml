name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Import Developer ID signing certificates
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail

          : "${DEVELOPER_ID_APPLICATION_P12_BASE64:?Missing DEVELOPER_ID_APPLICATION_P12_BASE64 secret}"
          : "${DEVELOPER_ID_APPLICATION_P12_PASSWORD:?Missing DEVELOPER_ID_APPLICATION_P12_PASSWORD secret}"
          : "${DEVELOPER_ID_INSTALLER_P12_BASE64:?Missing DEVELOPER_ID_INSTALLER_P12_BASE64 secret}"
          : "${DEVELOPER_ID_INSTALLER_P12_PASSWORD:?Missing DEVELOPER_ID_INSTALLER_P12_PASSWORD secret}"

          signing_keychain="$RUNNER_TEMP/pnt-cli-signing.keychain-db"
          signing_keychain_password="$(uuidgen)"
          app_certificate="$RUNNER_TEMP/developer-id-application.p12"
          installer_certificate="$RUNNER_TEMP/developer-id-installer.p12"

          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$app_certificate"
          printf '%s' "$DEVELOPER_ID_INSTALLER_P12_BASE64" | base64 -D > "$installer_certificate"

          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          security import "$app_certificate" -k "$signing_keychain" -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security import "$installer_certificate" -k "$signing_keychain" -P "$DEVELOPER_ID_INSTALLER_P12_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_keychain_password" "$signing_keychain"

          app_identity="$(security find-identity -v "$signing_keychain" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          pkg_identity="$(security find-identity -v "$signing_keychain" | awk -F '"' '/Developer ID Installer:/ { print $2; exit }')"
          if [[ -z "$app_identity" || -z "$pkg_identity" ]]; then
            echo "Could not find both Developer ID Application and Developer ID Installer identities." >&2
            security find-identity -v "$signing_keychain" >&2
            exit 1
          fi

          echo "PNT_CLI_APP_SIGN_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "PNT_CLI_PKG_SIGN_IDENTITY=$pkg_identity" >> "$GITHUB_ENV"
          echo "PNT_CLI_SIGNING_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"

      - name: Validate tag matches CLI version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cli_version="$(sed -n 's/^public let pntCliVersion = "\(.*\)"$/\1/p' Sources/PntCliCore/CLI.swift)"
          test "$tag_version" = "$cli_version"

      - name: Build release package
        run: PNT_CLI_REQUIRE_SIGNING=1 scripts/package-release.sh

      - name: Notarize release package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ -n "$APPLE_API_KEY_ID" || -n "$APPLE_API_ISSUER_ID" || -n "$APPLE_API_KEY_P8_BASE64" ]]; then
            : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID secret}"
            : "${APPLE_API_ISSUER_ID:?Missing APPLE_API_ISSUER_ID secret}"
            : "${APPLE_API_KEY_P8_BASE64:?Missing APPLE_API_KEY_P8_BASE64 secret}"

            notary_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$notary_key"
            chmod 600 "$notary_key"

            PNT_CLI_NOTARY_KEY_PATH="$notary_key" \
            PNT_CLI_NOTARY_KEY_ID="$APPLE_API_KEY_ID" \
            PNT_CLI_NOTARY_ISSUER_ID="$APPLE_API_ISSUER_ID" \
              scripts/notarize-package.sh
          else
            : "${APPLE_ID:?Missing APPLE_ID secret}"
            : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD secret}"
            : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"

            PNT_CLI_NOTARY_APPLE_ID="$APPLE_ID" \
            PNT_CLI_NOTARY_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD" \
            PNT_CLI_NOTARY_TEAM_ID="$APPLE_TEAM_ID" \
              scripts/notarize-package.sh
          fi

      - name: Verify release package
        run: |
          PNT_CLI_REQUIRE_SIGNED_BINARY=1 \
          PNT_CLI_REQUIRE_SIGNED_PKG=1 \
          PNT_CLI_REQUIRE_NOTARIZED_PKG=1 \
            scripts/verify-package.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="dist/pnt-cli-${version}.pkg"
          gh release create "$GITHUB_REF_NAME" "$package" \
            --title "pnt-cli $version" \
            --notes "Download pnt-cli-${version}.pkg and open it. The package is signed with Developer ID and notarized by Apple."

      - name: Delete signing keychain
        if: always()
        run: |
          if [[ -n "${PNT_CLI_SIGNING_KEYCHAIN:-}" && -f "$PNT_CLI_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$PNT_CLI_SIGNING_KEYCHAIN"
          fi
